<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WZQ · Lobby (Neubrutalist)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Archivo:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#111111}
.e-btn{transition:transform .08s ease, box-shadow .08s ease}
.e-btn:hover{transform:translate(-1px,-1px)!important;box-shadow:7px 7px 0 #111111!important}
.e-btn:active{transform:translate(5px,5px)!important;box-shadow:0 0 0 #111111!important}
.e-btn:focus-visible{outline:3px solid #111111;outline-offset:4px}
@keyframes wzq-e-marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
</style>
<style>
/* Preview frame only: centres the 390×844 phone screen on a neutral page. Not part of the design. */
html,body{min-height:100%}
body{background:#d9d9d9;display:flex;justify-content:center;align-items:flex-start;padding:24px 0}
#app>*{box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.embed body{padding:0;background:none;display:block}
.embed #app>*{box-shadow:none}
</style>
</head>
<body>
<div id="app"></div>

<!-- Screen markup (template syntax explained in wzq-lite.js) -->
<template id="screen">
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #ffe45e; color: #111111; font-family: 'Archivo', system-ui, sans-serif; padding: 16px 24px 24px; display: flex; flex-direction: column; gap: 24px; overflow: hidden">
<header style="height: 44px; display: flex; align-items: center; justify-content: space-between">
<span style="font-family: 'Archivo Black', sans-serif; font-size: 28px">WZQ</span>
<a class="e-btn" href="start.html" style="height: 44px; box-sizing: border-box; padding: 0 12px; display: flex; align-items: center; gap: 8px; background: #ffffff; border: 3px solid #111111; box-shadow: 4px 4px 0 #111111; color: #111111; text-decoration: none; font-family: 'Archivo Black', sans-serif; font-size: 13px">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square"><path d="M10 20H4V4h6"></path><path d="m16 17 5-5-5-5"></path><path d="M21 12H9"></path></svg>
<span>LEAVE GAME</span>
</a>
</header>
<main style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 24px">
<h1 style="margin: 0; font-size: 14px; font-weight: 700; letter-spacing: .06em">YOUR GAME CODE</h1>
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px">
<span style="height: 72px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: #ffffff; border: 3px solid #111111; font-family: 'Archivo Black', sans-serif; font-size: 34px">0</span>
<span style="height: 72px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: #ffffff; border: 3px solid #111111; font-family: 'Archivo Black', sans-serif; font-size: 34px">0</span>
<span style="height: 72px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: #ffffff; border: 3px solid #111111; font-family: 'Archivo Black', sans-serif; font-size: 34px">4</span>
<span style="height: 72px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: #ffffff; border: 3px solid #111111; font-family: 'Archivo Black', sans-serif; font-size: 34px">2</span>
<span style="height: 72px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: #ffffff; border: 3px solid #111111; font-family: 'Archivo Black', sans-serif; font-size: 34px">1</span>
<span style="height: 72px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: #ffffff; border: 3px solid #111111; font-family: 'Archivo Black', sans-serif; font-size: 34px">3</span>
</div>
<p style="margin: 0; font-size: 17px; font-weight: 600; line-height: 1.5; text-wrap: pretty">Send this code to your friend. The game starts the moment they join.</p>
<button class="e-btn" type="button" style="height: 60px; display: flex; align-items: center; justify-content: center; gap: 12px; background: #ff8ac4; border: 3px solid #111111; border-radius: 0; box-shadow: 6px 6px 0 #111111; color: #111111; font-family: 'Archivo Black', sans-serif; font-size: 18px; cursor: pointer">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="square"><rect x="9" y="9" width="12" height="12"></rect><path d="M5 15H3V3h12v2"></path></svg>
<span>COPY CODE</span>
</button>
</main>
<div role="status" style="margin: 0 -24px; padding: 12px 0; border-top: 3px solid #111111; border-bottom: 3px solid #111111; overflow: hidden; white-space: nowrap">
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Waiting for your friend to join</span>
<div aria-hidden="true" style="display: inline-flex; gap: 24px; font-size: 15px; font-weight: 700; letter-spacing: .06em; animation: wzq-e-marquee 12s linear infinite">
<span>WAITING FOR YOUR FRIEND ●</span><span>WAITING FOR YOUR FRIEND ●</span><span>WAITING FOR YOUR FRIEND ●</span>
<span>WAITING FOR YOUR FRIEND ●</span><span>WAITING FOR YOUR FRIEND ●</span><span>WAITING FOR YOUR FRIEND ●</span>
</div>
</div>
<div role="status" aria-live="polite" style="height: 24px; margin-top: -8px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; font-weight: 700; letter-spacing: .02em; opacity: .75">
<sc-if value="{{selfConnected}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="width: 12px; height: 12px; box-sizing: border-box; border-radius: 50%; background: #1fae5b; border: 2px solid #111111"></span></sc-if>
<sc-if value="{{selfConnecting}}" hint-placeholder-val="{{true}}"><span aria-hidden="true" style="width: 12px; height: 12px; box-sizing: border-box; border-radius: 50%; background: #f5b700; border: 2px solid #111111"></span></sc-if>
<sc-if value="{{selfOffline}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="width: 12px; height: 12px; box-sizing: border-box; border-radius: 50%; background: #e5383b; border: 2px solid #111111"></span></sc-if>
<span>{{connLabel}}</span>
</div>
</div>
</template>

<!-- Tweakable props (defaults). Override with URL query params, e.g. ?connection=offline -->
<script>window.WZQ_PROPS = {"connection":{"editor":"enum","options":["connected","connecting","offline"],"default":"connecting"},"$preview":{"width":390,"height":844}};</script>
<script src="wzq-lite.js"></script>
<script>
var CONN_LABELS = { connected: 'Connected to server', connecting: 'Connecting to server…', offline: 'Not connected to server · retrying' };
class Component extends DCLogic {
  renderVals() {
    var conn = this.props.connection ?? 'connecting';
    return {
      selfConnected: conn === 'connected',
      selfConnecting: conn === 'connecting',
      selfOffline: conn === 'offline',
      connLabel: CONN_LABELS[conn] || CONN_LABELS.connected
    };
  }
}
WZQ_MOUNT(Component);
</script>
</body>
</html>
