<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WZQ · Start (Neubrutalist)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Archivo:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#111111}
#e-code::placeholder{color:#9a9a9a}
#e-code:focus{outline:none;background:#fffbe0!important}
.e-btn{transition:transform .08s ease, box-shadow .08s ease}
.e-btn:hover{transform:translate(-1px,-1px)!important;box-shadow:7px 7px 0 #111111!important}
.e-btn:active{transform:translate(5px,5px)!important;box-shadow:0 0 0 #111111!important}
.e-btn:focus-visible{outline:3px solid #111111;outline-offset:4px}
</style>
<style>
/* Preview frame only: centres the 390×844 phone screen on a neutral page. Not part of the design. */
html,body{min-height:100%}
body{background:#d9d9d9;display:flex;justify-content:center;align-items:flex-start;padding:24px 0}
#app>*{box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.embed body{padding:0;background:none;display:block}
.embed #app>*{box-shadow:none}
</style>
</head>
<body>
<div id="app"></div>

<!-- Screen markup (template syntax explained in wzq-lite.js) -->
<template id="screen">
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #ffe45e; color: #111111; font-family: 'Archivo', system-ui, sans-serif; padding: 40px 24px 24px; display: flex; flex-direction: column; gap: 24px; overflow: hidden">
<sc-if value="{{gone}}" hint-placeholder-val="{{false}}">
<div role="status" style="display: flex; align-items: flex-start; gap: 10px; font-size: 15px; font-weight: 600; line-height: 1.45">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" style="flex: none; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5"></path><path d="M12 16v.5"></path></svg>
<span>That game no longer exists. Start a new one, or join a friend's.</span>
</div>
</sc-if>
<div style="position: relative; margin-top: 12px; padding: 22px 22px 18px; background: #ffffff; border: 3px solid #111111">
<h1 style="margin: 0; font-family: 'Archivo Black', sans-serif; font-size: 96px; line-height: .95; letter-spacing: -.02em">WZQ</h1>
<p style="margin: 10px 0 0; font-size: 17px; font-weight: 600; line-height: 1.45; text-wrap: pretty">Five in a row, played between friends. No sign-up.</p>
<span aria-hidden="true" style="position: absolute; right: -10px; top: -18px; padding: 8px 12px; background: #ff8ac4; border: 3px solid #111111; transform: rotate(8deg); font-family: 'Archivo Black', sans-serif; font-size: 14px; letter-spacing: .02em">5 IN A ROW</span>
</div>
<div aria-hidden="true" style="padding: 18px; background: #8ab4ff; border: 3px solid #111111; display: flex; align-items: center; justify-content: space-between">
<span style="width: 38px; height: 38px; border-radius: 50%; background: #111111"></span>
<span style="width: 38px; height: 38px; border-radius: 50%; background: #111111"></span>
<span style="width: 38px; height: 38px; border-radius: 50%; background: #111111"></span>
<span style="width: 38px; height: 38px; border-radius: 50%; background: #111111"></span>
<span style="width: 38px; height: 38px; border-radius: 50%; background: #111111"></span>
<span style="width: 38px; height: 38px; box-sizing: border-box; border-radius: 50%; background: #ffffff; border: 3px solid #111111"></span>
</div>
<div style="flex: 1"></div>
<div style="display: flex; flex-direction: column; gap: 26px">
<a class="e-btn" href="lobby.html" style="height: 62px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 12px; background: #ff8ac4; border: 3px solid #111111; box-shadow: 6px 6px 0 #111111; color: #111111; font-family: 'Archivo Black', sans-serif; font-size: 19px; letter-spacing: .02em; text-decoration: none">
<span>START A GAME</span>
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square"><path d="M4 12h15"></path><path d="m13 6 6 6-6 6"></path></svg>
</a>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="e-code" style="font-size: 14px; font-weight: 700; letter-spacing: .04em">GOT A CODE? JOIN IN</label>
<div style="display: flex; gap: 12px">
<input id="e-code" type="text" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="000000" style="flex: 1; min-width: 0; height: 62px; box-sizing: border-box; padding: 0 16px; background: #ffffff; border: 3px solid #111111; border-radius: 0; box-shadow: inset 4px 4px 0 rgba(17,17,17,.14); color: #111111; font-family: 'Archivo Black', sans-serif; font-size: 26px; letter-spacing: .22em">
<a class="e-btn" href="game-joined.html" style="width: 100px; height: 62px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 6px; background: #ffffff; border: 3px solid #111111; box-shadow: 6px 6px 0 #111111; color: #111111; text-decoration: none; font-family: 'Archivo Black', sans-serif; font-size: 16px">
<span>JOIN</span>
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square"><path d="M4 12h15"></path><path d="m13 6 6 6-6 6"></path></svg>
</a>
</div>
<sc-if value="{{badCode}}" hint-placeholder-val="{{false}}">
<p role="alert" style="margin: 0; display: flex; align-items: flex-start; gap: 8px; font-size: 14px; font-weight: 700; line-height: 1.45; color: #9b0020">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" style="flex: none; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5"></path><path d="M12 16v.5"></path></svg>
<span>No game in the lobby has that code. Check it with your friend.</span>
</p>
</sc-if>
</div>
</div>
<div role="status" aria-live="polite" style="height: 24px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; font-weight: 700; letter-spacing: .02em; opacity: .75">
<sc-if value="{{connected}}" hint-placeholder-val="{{true}}"><span aria-hidden="true" style="width: 12px; height: 12px; box-sizing: border-box; border-radius: 50%; background: #1fae5b; border: 2px solid #111111"></span></sc-if>
<sc-if value="{{connecting}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="width: 12px; height: 12px; box-sizing: border-box; border-radius: 50%; background: #f5b700; border: 2px solid #111111"></span></sc-if>
<sc-if value="{{offline}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="width: 12px; height: 12px; box-sizing: border-box; border-radius: 50%; background: #e5383b; border: 2px solid #111111"></span></sc-if>
<span>{{connLabel}}</span>
</div>
</div>
</template>

<!-- Tweakable props (defaults). Override with URL query params, e.g. ?connection=offline -->
<script>window.WZQ_PROPS = {"connection":{"editor":"enum","options":["connected","connecting","offline"],"default":"connected"},"notice":{"editor":"enum","options":["none","game-gone","bad-code"],"default":"none"},"$preview":{"width":390,"height":844}};</script>
<script src="wzq-lite.js"></script>
<script>
var CONN_LABELS = { connected: 'Connected to server', connecting: 'Connecting to server…', offline: 'Not connected to server · retrying' };
class Component extends DCLogic {
  renderVals() {
    var n = this.props.notice ?? 'none';
    var conn = this.props.connection ?? 'connected';
    return {
      gone: n === 'game-gone',
      badCode: n === 'bad-code',
      connected: conn === 'connected',
      connecting: conn === 'connecting',
      offline: conn === 'offline',
      connLabel: CONN_LABELS[conn] || CONN_LABELS.connected
    };
  }
}
WZQ_MOUNT(Component);
</script>
</body>
</html>
