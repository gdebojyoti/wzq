<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WZQ · Desktop Start (Neubrutalist)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Archivo:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#111111}
#de1-code::placeholder{color:#9a9a9a}
#de1-code:focus{outline:none;background:#fffbe0!important}
.e-btn{transition:transform .08s ease, box-shadow .08s ease}
.e-btn:hover{transform:translate(-1px,-1px)!important;box-shadow:7px 7px 0 #111111!important}
.e-btn:active{transform:translate(5px,5px)!important;box-shadow:0 0 0 #111111!important}
.e-btn:focus-visible{outline:3px solid #111111;outline-offset:4px}
</style>
</head>
<body>
<div id="app"></div>

<!-- Screen markup (template syntax explained in wzq-lite.js) -->
<template id="screen">
<div style="min-height: 100vh; box-sizing: border-box; background: #ffe45e; color: #111111; font-family: 'Archivo', system-ui, sans-serif; display: flex; flex-wrap: wrap">
<section style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 64px 72px; display: flex; flex-direction: column; justify-content: center; gap: 40px">
<div style="position: relative; max-width: 640px; padding: 32px 36px 28px; background: #ffffff; border: 3px solid #111111">
<h1 style="margin: 0; font-family: 'Archivo Black', sans-serif; font-size: 168px; line-height: .9; letter-spacing: -.02em">WZQ</h1>
<p style="margin: 18px 0 0; font-size: 22px; font-weight: 600; line-height: 1.45; text-wrap: pretty">Five in a row, played between friends. No sign-up.</p>
<span aria-hidden="true" style="position: absolute; right: -18px; top: -24px; padding: 10px 16px; background: #ff8ac4; border: 3px solid #111111; transform: rotate(8deg); font-family: 'Archivo Black', sans-serif; font-size: 18px; letter-spacing: .02em">5 IN A ROW</span>
</div>
<div aria-hidden="true" style="max-width: 640px; box-sizing: border-box; padding: 22px 28px; background: #8ab4ff; border: 3px solid #111111; display: flex; align-items: center; justify-content: space-between">
<span style="width: 56px; height: 56px; border-radius: 50%; background: #111111"></span>
<span style="width: 56px; height: 56px; border-radius: 50%; background: #111111"></span>
<span style="width: 56px; height: 56px; border-radius: 50%; background: #111111"></span>
<span style="width: 56px; height: 56px; border-radius: 50%; background: #111111"></span>
<span style="width: 56px; height: 56px; border-radius: 50%; background: #111111"></span>
<span style="width: 56px; height: 56px; box-sizing: border-box; border-radius: 50%; background: #ffffff; border: 4px solid #111111"></span>
</div>
</section>
<aside style="flex: 1 1 440px; max-width: 560px; min-height: 100vh; box-sizing: border-box; padding: 64px 56px 28px; background: #ffffff; border-left: 3px solid #111111; display: flex; flex-direction: column; gap: 32px">
<sc-if value="{{gone}}" hint-placeholder-val="{{false}}">
<div role="status" style="display: flex; align-items: flex-start; gap: 10px; font-size: 16px; font-weight: 600; line-height: 1.45">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" style="flex: none; margin-top: 2px"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5"></path><path d="M12 16v.5"></path></svg>
<span>That game no longer exists. Start a new one, or join a friend's.</span>
</div>
</sc-if>
<div style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 40px">
<div style="display: flex; flex-direction: column; gap: 16px">
<h2 style="margin: 0; font-family: 'Archivo Black', sans-serif; font-size: 32px; line-height: 1.1">Start a new game</h2>
<p style="margin: 0; font-size: 17px; font-weight: 500; line-height: 1.5">You'll get a six-digit code to send to your friend.</p>
<a class="e-btn" href="lobby.html" style="margin-top: 8px; height: 64px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 12px; background: #ff8ac4; border: 3px solid #111111; box-shadow: 6px 6px 0 #111111; color: #111111; font-family: 'Archivo Black', sans-serif; font-size: 20px; letter-spacing: .02em; text-decoration: none">
<span>START A GAME</span>
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square"><path d="M4 12h15"></path><path d="m13 6 6 6-6 6"></path></svg>
</a>
</div>
<div aria-hidden="true" style="display: flex; align-items: center; gap: 14px; font-family: 'Archivo Black', sans-serif; font-size: 14px"><span style="flex: 1; height: 3px; background: #111111"></span><span>OR</span><span style="flex: 1; height: 3px; background: #111111"></span></div>
<div style="display: flex; flex-direction: column; gap: 12px">
<label for="de1-code" style="font-family: 'Archivo Black', sans-serif; font-size: 32px; line-height: 1.1">Join a friend's game</label>
<div style="display: flex; gap: 14px">
<input id="de1-code" type="text" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="000000" style="flex: 1; min-width: 0; height: 64px; box-sizing: border-box; padding: 0 18px; background: #ffffff; border: 3px solid #111111; border-radius: 0; box-shadow: inset 4px 4px 0 rgba(17,17,17,.14); color: #111111; font-family: 'Archivo Black', sans-serif; font-size: 28px; letter-spacing: .24em">
<a class="e-btn" href="game.html" style="width: 120px; height: 64px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 8px; background: #ffffff; border: 3px solid #111111; box-shadow: 6px 6px 0 #111111; color: #111111; text-decoration: none; font-family: 'Archivo Black', sans-serif; font-size: 17px">
<span>JOIN</span>
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square"><path d="M4 12h15"></path><path d="m13 6 6 6-6 6"></path></svg>
</a>
</div>
<sc-if value="{{badCode}}" hint-placeholder-val="{{false}}">
<p role="alert" style="margin: 0; display: flex; align-items: flex-start; gap: 8px; font-size: 15px; font-weight: 700; line-height: 1.45; color: #9b0020">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" style="flex: none; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5"></path><path d="M12 16v.5"></path></svg>
<span>No game in the lobby has that code. Check it with your friend.</span>
</p>
</sc-if>
</div>
</div>
<div role="status" aria-live="polite" style="height: 24px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; font-weight: 700; letter-spacing: .02em; opacity: .75">
<sc-if value="{{connected}}" hint-placeholder-val="{{true}}"><span aria-hidden="true" style="width: 12px; height: 12px; box-sizing: border-box; border-radius: 50%; background: #1fae5b; border: 2px solid #111111"></span></sc-if>
<sc-if value="{{connecting}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="width: 12px; height: 12px; box-sizing: border-box; border-radius: 50%; background: #f5b700; border: 2px solid #111111"></span></sc-if>
<sc-if value="{{offline}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="width: 12px; height: 12px; box-sizing: border-box; border-radius: 50%; background: #e5383b; border: 2px solid #111111"></span></sc-if>
<span>{{connLabel}}</span>
</div>
</aside>
</div>
</template>

<!-- Tweakable props (defaults). Override with URL query params, e.g. ?connection=offline -->
<script>window.WZQ_PROPS = {"connection":{"editor":"enum","options":["connected","connecting","offline"],"default":"connected"},"notice":{"editor":"enum","options":["none","game-gone","bad-code"],"default":"none"},"$preview":{"width":1440,"height":900}};</script>
<script src="wzq-lite.js"></script>
<script>
var CONN_LABELS = { connected: 'Connected to server', connecting: 'Connecting to server…', offline: 'Not connected to server · retrying' };
class Component extends DCLogic {
  renderVals() {
    var n = this.props.notice ?? 'none';
    var conn = this.props.connection ?? 'connected';
    return {
      gone: n === 'game-gone',
      badCode: n === 'bad-code',
      connected: conn === 'connected',
      connecting: conn === 'connecting',
      offline: conn === 'offline',
      connLabel: CONN_LABELS[conn] || CONN_LABELS.connected
    };
  }
}
WZQ_MOUNT(Component);
</script>
</body>
</html>
